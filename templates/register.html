{% extends 'base.html' %}
{% block title %}Registro — PokéShop TCG{% endblock %}
{% block content %}

<section class="auth-section">
  <div class="auth-card">
    <div class="auth-logo">⚡</div>
    <h1>Crear cuenta</h1>
    <p class="auth-sub">Únete a PokéShop y empieza tu colección</p>

    <form method="POST" class="auth-form">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="username" placeholder="Ej: AshKetchum99" required minlength="3" maxlength="20">
      </div>
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" name="email" placeholder="tu@correo.com" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>
      <button type="submit" class="btn-primary full-width">Crear cuenta →</button>
    </form>

    <p class="auth-switch">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
  </div>
</section>

{% endblock %}
